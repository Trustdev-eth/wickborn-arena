server {
    listen 80;
    listen [::]:80;
    server_name wickbornarena.xyz www.wickbornarena.xyz;

    if ($host = www.wickbornarena.xyz) {
        return 301 http://wickbornarena.xyz$request_uri;
    }

    root /home/ubuntu/ohio/wickborn/wickborn-arena-landingpage/out;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type text/plain;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
